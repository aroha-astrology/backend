name: Security

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action@v2 now requires a paid GITLEAKS_LICENSE secret
      # for org-owned repos (aroha-astrology is an org), which failed every run.
      # The scanner itself is free OSS; run its Docker image directly, same as
      # the frontend repo.
      - name: Gitleaks
        uses: docker://zricethezav/gitleaks:v8.30.1
        with:
          args: detect --source=/github/workspace --redact --exit-code 1 -v

  dependency-audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # npm, not pnpm: package-lock.json is what the deploy installs from, and
      # pnpm/action-setup failed every run for want of a pinned pnpm version.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      # Reports only — does not fail the build. Several existing High/Critical
      # advisories trace to the unwired legacy apps/api subsystem or to
      # devDependency-only tooling; see SECURITY_AND_PRIVACY_AUDIT.md for the
      # triaged list before flipping this to fail-on-finding.
      - name: npm audit (report only)
        run: npm audit --audit-level=high || true
